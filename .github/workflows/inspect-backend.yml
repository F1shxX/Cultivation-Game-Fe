name: Inspect Backend Host

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Inspect API process
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" '
            set -u
            echo "== node processes =="
            ps -eo pid,ppid,cmd | grep -E "node|tsx|pm2" | grep -v grep || true
            echo "== process working directories =="
            for pid in $(pgrep -f "node|tsx" || true); do
              printf "%s " "$pid"
              readlink -f "/proc/$pid/cwd" || true
            done
            echo "== process managers =="
            command -v pm2 >/dev/null && pm2 list || true
            systemctl --no-pager --type=service --all | grep -Ei "wanhua|cultivation|node|pm2" || true
            echo "== likely directories =="
            find /var/www /opt /srv /root -maxdepth 4 -type f -name package.json 2>/dev/null | head -50
            echo "== nginx API route =="
            nginx -T 2>/dev/null | grep -B4 -A8 "wanhua-api" || true
          '
